<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD21F">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rider Ledger – Rapido earnings, petrol & EMI tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#14181F;--mut:#5E6675;--line:#E1E5EC;--y:#FFD21F;--g:#0B8A5E;--r:#C93B3B;--in:#F3F5F8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1218;--card:#181C25;--ink:#F1F3F7;--mut:#9AA3B2;--line:#272C38;--g:#3DD598;--r:#FF7A7A;--in:#0F1218}}
:root[data-theme="dark"]{--bg:#0F1218;--card:#181C25;--ink:#F1F3F7;--mut:#9AA3B2;--line:#272C38;--g:#3DD598;--r:#FF7A7A;--in:#0F1218}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px;font-weight:800}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--y);border-color:var(--y);color:#14181F}
.hero{background:var(--ink);color:var(--bg);border:0}
.hero .big{font-size:38px;font-weight:800;line-height:1.1}
.hero small{opacity:.7}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border:0}
.row b{font-weight:600}
.pos{color:var(--g)}.neg{color:var(--r)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--in);color:var(--ink);font:inherit;font-size:16px}
input:focus,button:focus-visible{outline:2px solid var(--y);outline-offset:1px}
.save{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--y);color:#14181F;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
h2{font-size:15px;margin:0 0 10px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars i{display:block;background:var(--y);border-radius:6px 6px 0 0;min-height:3px}
.bars i.n{background:var(--r)}
.tip{padding:9px 11px;border-radius:10px;background:var(--in);font-size:13.5px;margin-bottom:8px;border-left:4px solid var(--y)}
.tip.w{border-color:var(--r)}.tip.ok{border-color:var(--g)}
.prog{height:10px;background:var(--in);border-radius:6px;overflow:hidden;margin:6px 0}
.prog span{display:block;height:100%;background:var(--g)}
.e{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.e:last-child{border:0}
.e button{background:none;border:0;color:var(--r);font:inherit;cursor:pointer;padding:6px}
.empty{color:var(--mut);font-size:13.5px}
</style>
</head>
<body>
<main>
<h1 style="display:flex;align-items:center;gap:10px"><svg width="42" height="42" viewBox="0 0 40 40" role="img" aria-label="Rider Ledger logo"><rect width="40" height="40" rx="11" fill="#FFD21F"/><text x="20" y="21" text-anchor="middle" font-family="Sora,system-ui,sans-serif" font-weight="800" font-size="19" fill="#14181F">₹</text><circle cx="11.5" cy="31" r="4" fill="none" stroke="#14181F" stroke-width="2.4"/><circle cx="28.5" cy="31" r="4" fill="none" stroke="#14181F" stroke-width="2.4"/><path d="M15.5 31h9" stroke="#14181F" stroke-width="2.4" stroke-linecap="round"/></svg>Rider Ledger</h1>
<p class="sub">Track Rapido earnings, petrol, expenses and bike EMI in one place.</p>

<div class="tabs" id="tabs">
<button data-p="week" class="on">This week</button>
<button data-p="month">This month</button>
</div>

<div class="card hero">
<small id="plabel"></small>
<div class="big" id="net"></div>
<small>Take-home after petrol, expenses and EMI</small>
</div>

<div class="card" id="stats"></div>

<div class="card">
<h2>Bike EMI &amp; weekly target</h2>
<div class="grid">
<div><label>Monthly bike EMI (₹)</label><input id="emi" type="number" inputmode="numeric" placeholder="e.g. 3500"></div>
<div><label>Weekly take-home target (₹)</label><input id="goal" type="number" inputmode="numeric" placeholder="e.g. 5000"></div>
</div>
<div class="prog"><span id="gbar" style="width:0"></span></div>
<div id="goalinfo" style="font-size:13px;color:var(--mut)"></div>
</div>

<div class="card"><h2>Last 7 days: earnings minus petrol &amp; expenses</h2><div class="bars" id="bars"></div></div>

<div class="card"><h2>Suggestions</h2><div id="tips"></div></div>

<div class="card">
<h2>Add a day's entry</h2>
<div class="grid">
<div><label>Date</label><input id="d" type="date"></div>
<div><label>Rapido earnings (₹)</label><input id="inc" type="number" inputmode="decimal" placeholder="0"></div>
<div><label>Petrol (₹)</label><input id="pet" type="number" inputmode="decimal" placeholder="0"></div>
<div><label>Other expenses (₹) – tea, parking</label><input id="oth" type="number" inputmode="decimal" placeholder="0"></div>
<div><label>Rides completed</label><input id="rides" type="number" inputmode="numeric" placeholder="0"></div>
<div><label>Total km ridden</label><input id="km" type="number" inputmode="decimal" placeholder="0"></div>
</div>
<button class="save" id="save">Save entry</button>
</div>

<div class="card"><h2>Recent entries</h2><div id="list"></div></div>
</main>

<script>
var KEY="rider-hisab-v1",entries=[],goal=0,emi=0,period="week";
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);entries=o.entries||[];goal=o.goal||0;emi=o.emi||0}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({entries:entries,goal:goal,emi:emi}))}catch(e){}}
function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
function inr(n){return (n<0?"−":"")+"₹"+Math.abs(Math.round(n)).toLocaleString("en-IN")}
function net(e){return e.inc-e.pet-e.oth}
function range(p){var t=new Date(),s;if(p=="week"){var w=(t.getDay()+6)%7;s=new Date(t.getFullYear(),t.getMonth(),t.getDate()-w)}else s=new Date(t.getFullYear(),t.getMonth(),1);return iso(s)}
function inPeriod(p){var s=range(p),t=iso(new Date());return entries.filter(function(e){return e.d>=s&&e.d<=t})}
function sum(a,k){return a.reduce(function(x,e){return x+(e[k]||0)},0)}
function tot(a){return a.reduce(function(x,e){return x+net(e)},0)}
function emiShare(p){return p=="week"?emi*7/30:emi}
var $=function(i){return document.getElementById(i)};

function render(){
var a=inPeriod(period),inc=sum(a,"inc"),pet=sum(a,"pet"),oth=sum(a,"oth"),km=sum(a,"km"),rd=sum(a,"rides"),
 pre=inc-pet-oth,es=emiShare(period),n=pre-es;
$("plabel").textContent=period=="week"?"This week (from Monday)":"This month";
$("net").textContent=inr(n);
var rows=[["Total earnings",inr(inc),""],["Petrol","− "+inr(pet),"neg"],["Other expenses","− "+inr(oth),"neg"],
 ["Profit before EMI",inr(pre),pre>=0?"pos":"neg"],
 [period=="week"?"Bike EMI (weekly share)":"Bike EMI (monthly)","− "+inr(es),"neg"],
 ["Days worked",a.length+"",""],["Rides / km",rd+" / "+Math.round(km)+" km",""]];
if(a.length)rows.push(["Avg profit per day (before EMI)",inr(pre/a.length),pre>=0?"pos":"neg"]);
if(km>0)rows.push(["Profit per km (before EMI)","₹"+(pre/km).toFixed(2),""],["Petrol cost per km","₹"+(pet/km).toFixed(2),""]);
if(rd>0)rows.push(["Earnings per ride","₹"+(inc/rd).toFixed(0),""]);
$("stats").innerHTML=rows.map(function(r){return '<div class="row"><span>'+r[0]+'</span><b class="'+r[2]+'">'+r[1]+'</b></div>'}).join("");

var wk=inPeriod("week"),wn=tot(wk)-emiShare("week"),pct=goal>0?Math.min(100,Math.max(0,wn/goal*100)):0;
$("gbar").style.width=pct+"%";
$("goalinfo").textContent=goal>0?(wn>=goal?"Target reached this week 🎉":inr(goal-wn)+" more to reach this week's target"):"Set a weekly target to track progress";

var days=[],t=new Date(),mx=1;
for(var i=6;i>=0;i--){var dt=new Date(t.getFullYear(),t.getMonth(),t.getDate()-i),k=iso(dt);
 var v=tot(entries.filter(function(e){return e.d==k}));days.push({l:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()],v:v});mx=Math.max(mx,Math.abs(v))}
$("bars").innerHTML=days.map(function(x){return '<div><span style="font-size:10px">'+(x.v?Math.round(x.v):"")+'</span><i class="'+(x.v<0?"n":"")+'" style="height:'+Math.abs(x.v)/mx*80+'px"></i>'+x.l+'</div>'}).join("");

$("tips").innerHTML=tips(a,inc,pet,oth,km,rd,pre).map(function(x){return '<div class="tip '+x[0]+'">'+x[1]+'</div>'}).join("");

var l=entries.slice().sort(function(a,b){return a.d<b.d?1:-1}).slice(0,15);
$("list").innerHTML=l.length?l.map(function(e){
 return '<div class="e"><span><b>'+e.d.split("-").reverse().join("/")+'</b><br><small style="color:var(--mut)">Earned '+inr(e.inc)+' · Petrol '+inr(e.pet)+' · '+e.rides+' rides</small></span><span><b class="'+(net(e)>=0?"pos":"neg")+'">'+inr(net(e))+'</b> <button data-id="'+e.id+'" aria-label="Delete entry">✕</button></span></div>'}).join(""):'<p class="empty">No entries yet. Add your first day above.</p>';
}

function tips(a,inc,pet,oth,km,rd,pre){
var t=[];
if(!entries.length)return [["","Spend 30 seconds each night adding your day. By the end of the week you'll see your real profit."]];
if(emi>0){t.push(["","Set aside about "+inr(emi/30)+" every day for your EMI so it's never a surprise."]);
 var mo=inPeriod("month"),mp=tot(mo);
 if(mo.length>=3){var proj=mp/mo.length*26;t.push([proj>=emi*1.5?"ok":"w","At your current pace you'll make about "+inr(proj)+" this month (26 working days) before EMI. Your EMI is "+inr(emi)+", which is "+(emi/Math.max(proj,1)*100).toFixed(0)+"% of that."]);}}
if(inc>0){var pp=pet/inc*100;
 if(pp>30)t.push(["w","Petrol takes "+pp.toFixed(0)+"% of your earnings. Avoid long empty rides to pickups and keep tyre pressure right."]);
 else t.push(["ok","Petrol is "+pp.toFixed(0)+"% of your earnings, which is a healthy range."]);}
if(km>0&&rd>0&&km/rd>6)t.push(["w","You ride "+(km/rd).toFixed(1)+" km per ride on average. Accept nearer pickups to cut unpaid distance."]);
var by={},nm=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
entries.forEach(function(e){var w=new Date(e.d+"T00:00:00").getDay();(by[w]=by[w]||[]).push(net(e))});
var best=null,bv=-1e9;
for(var w in by){if(by[w].length>=2){var av=by[w].reduce(function(x,y){return x+y},0)/by[w].length;if(av>bv){bv=av;best=w}}}
if(best!==null)t.push(["ok","Your best day is "+nm[best]+" (average "+inr(bv)+"). Put in extra hours then."]);
if(goal>0){var dl=7-((new Date().getDay()+6)%7),need=goal-(tot(inPeriod("week"))-emiShare("week"));if(need>0)t.push(["","To hit your weekly target you need about "+inr(need/dl)+" per day for the remaining "+dl+" day(s)."]);}
if(oth>0&&inc>0&&oth/inc>0.1)t.push(["w","Other expenses are "+(oth/inc*100).toFixed(0)+"% of earnings. Watch tea and parking costs."]);
t.push(["","Keep a small daily amount aside for servicing and chain oil so repairs don't hurt your month."]);
return t.slice(0,6);}

$("tabs").onclick=function(ev){var p=ev.target.dataset.p;if(!p)return;period=p;[].forEach.call(this.children,function(b){b.classList.toggle("on",b.dataset.p==p)});render()};
$("goal").onchange=function(){goal=+this.value||0;save();render()};
$("emi").onchange=function(){emi=+this.value||0;save();render()};
$("save").onclick=function(){
 var g=function(i){return +$(i).value||0},d=$("d").value;
 if(!d||(!g("inc")&&!g("pet")&&!g("oth"))){alert("Enter a date and at least one amount.");return}
 entries.push({id:Date.now(),d:d,inc:g("inc"),pet:g("pet"),oth:g("oth"),rides:g("rides"),km:g("km")});
 save();["inc","pet","oth","rides","km"].forEach(function(i){$(i).value=""});render()};
$("list").onclick=function(ev){var id=ev.target.dataset.id;if(!id)return;entries=entries.filter(function(e){return e.id!=id});save();render()};

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
load();$("d").value=iso(new Date());
if(goal)$("goal").value=goal;if(emi)$("emi").value=emi;
render();
</script>
</body>
</html>
